[project]
name = "icloud-mcp"
version = "0.1.0"
description = "Read-only MCP server for iCloud Mail over IMAP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0,<2"]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icloud_mcp"]
